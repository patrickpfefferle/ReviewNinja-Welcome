<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Horn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial Black', Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .title {
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 48px;
      opacity: 0.5;
    }

    .btn-wrap {
      position: relative;
    }

    .ripple-ring {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      border: 4px solid #ff3c00;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    #horn-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 35%, #ff6a00, #ff3c00 60%, #b02200);
      color: #fff;
      font-size: 3.2rem;
      cursor: pointer;
      position: relative;
      box-shadow:
        0 0 0 8px rgba(255, 60, 0, 0.15),
        0 0 40px rgba(255, 60, 0, 0.4),
        0 12px 40px rgba(0, 0, 0, 0.7);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    #horn-btn:hover {
      box-shadow:
        0 0 0 12px rgba(255, 60, 0, 0.2),
        0 0 60px rgba(255, 60, 0, 0.6),
        0 12px 40px rgba(0, 0, 0, 0.7);
    }

    #horn-btn:active,
    #horn-btn.pressed {
      transform: scale(0.92);
      box-shadow:
        0 0 0 6px rgba(255, 60, 0, 0.3),
        0 0 80px rgba(255, 100, 0, 0.8),
        0 6px 20px rgba(0, 0, 0, 0.7);
    }

    .icon {
      display: block;
      line-height: 1;
    }

    .label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 3px;
      margin-top: 6px;
      opacity: 0.85;
    }

    .hint {
      color: #fff;
      opacity: 0.25;
      font-size: 0.75rem;
      margin-top: 48px;
      letter-spacing: 2px;
    }

    /* ripple animation */
    @keyframes ripple {
      0%   { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .ripple-ring.fire {
      animation: ripple 0.6s ease-out forwards;
    }

    /* screen flash */
    .flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 80, 0, 0.12);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s;
    }

    .flash.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="flash" id="flash"></div>

<p class="title">Air Horn</p>

<div class="btn-wrap">
  <div class="ripple-ring" id="ring1"></div>
  <div class="ripple-ring" id="ring2"></div>
  <button id="horn-btn" aria-label="Air Horn">
    <span class="icon">📣</span>
    <span class="label">HONK</span>
  </button>
</div>

<p class="hint">PRESS &amp; HOLD</p>

<script>
  const btn   = document.getElementById('horn-btn');
  const flash = document.getElementById('flash');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');

  let ctx = null;
  let activeNodes = [];
  let holdTimeout = null;
  let rippleTimer = null;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function makeDistortion(audioCtx, amount = 280) {
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i * 2) / 256 - 1;
      curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
    }
    const ws = audioCtx.createWaveShaper();
    ws.curve = curve;
    ws.oversample = '4x';
    return ws;
  }

  function playHorn(audioCtx) {
    const now = audioCtx.currentTime;

    // Classic air horn = multiple sawtooth oscillators + pitch sweep + distortion
    const frequencies = [
      { base: 880, detune: 0 },
      { base: 880, detune: 7 },
      { base: 440, detune: -5 },
    ];

    const masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.001, now);
    masterGain.gain.exponentialRampToValueAtTime(0.7, now + 0.04);

    const distortion = makeDistortion(audioCtx, 320);
    const masterFilter = audioCtx.createBiquadFilter();
    masterFilter.type = 'bandpass';
    masterFilter.frequency.value = 1200;
    masterFilter.Q.value = 0.6;

    masterGain.connect(distortion);
    distortion.connect(masterFilter);
    masterFilter.connect(audioCtx.destination);

    const oscillators = frequencies.map(({ base, detune }) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';

      // Pitch sweep: start ~30% higher, drop to base over 0.15s
      osc.frequency.setValueAtTime(base * 1.3, now);
      osc.frequency.exponentialRampToValueAtTime(base, now + 0.15);

      osc.detune.setValueAtTime(detune, now);
      osc.connect(masterGain);
      osc.start(now);
      return osc;
    });

    activeNodes = [...oscillators, masterGain, distortion, masterFilter];

    return { oscillators, masterGain };
  }

  function stopHorn() {
    if (!ctx) return;
    const now = ctx.currentTime;
    activeNodes.forEach(node => {
      if (node instanceof OscillatorNode) {
        try { node.stop(now + 0.12); } catch (_) {}
      } else if (node instanceof GainNode) {
        node.gain.setValueAtTime(node.gain.value, now);
        node.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      }
    });
    activeNodes = [];
  }

  function fireRipple() {
    [ring1, ring2].forEach((r, i) => {
      r.classList.remove('fire');
      void r.offsetWidth; // reflow to restart animation
      setTimeout(() => r.classList.add('fire'), i * 140);
    });
  }

  function triggerFlash() {
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 80);
  }

  function onPress(e) {
    e.preventDefault();
    btn.classList.add('pressed');
    const audioCtx = getCtx();
    stopHorn();
    playHorn(audioCtx);
    triggerFlash();
    fireRipple();

    // keep rippling while held
    rippleTimer = setInterval(fireRipple, 700);
  }

  function onRelease(e) {
    e.preventDefault();
    btn.classList.remove('pressed');
    stopHorn();
    clearInterval(rippleTimer);
  }

  // Mouse
  btn.addEventListener('mousedown',  onPress);
  btn.addEventListener('mouseup',    onRelease);
  btn.addEventListener('mouseleave', onRelease);

  // Touch
  btn.addEventListener('touchstart', onPress,   { passive: false });
  btn.addEventListener('touchend',   onRelease, { passive: false });

  // Spacebar / Enter
  document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) onPress(e);
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'Enter') onRelease(e);
  });
</script>
</body>
</html>
